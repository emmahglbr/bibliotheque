<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ma bibliothèque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --soft:#F5F5F4; --ink:#141414; --muted:#8C8C8A; --line:#EAEAE8;
  --accent:#141414; --accent-ink:#FFFFFF; --heart:#E5484D; --prog:#141414;
  --serif:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --navh:64px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E0E0E;--soft:#1A1A1A;--ink:#F2F2F0;--muted:#8A8A88;--line:#262626;--accent:#F2F2F0;--accent-ink:#0E0E0E;--prog:#F2F2F0}
}
*{box-sizing:border-box}
html{color-scheme:light dark;-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}

/* en-tête */
header{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end;margin-bottom:36px}
h1{font:400 clamp(2.4rem,6vw,3.4rem)/1 var(--serif);margin:0;letter-spacing:-.01em}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:.85rem}
.stat b{color:var(--ink);font-weight:600;margin-right:4px}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* boutons */
.btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;font-size:.9rem;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{opacity:.85}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:transparent}
.btn.danger{border-color:transparent;color:var(--heart)}
.btn.danger:hover{border-color:var(--heart)}

/* onglets (ordinateur) */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{border:0;background:none;padding:0 0 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.tab span{margin-left:6px;font-size:.8em;opacity:.7}

/* outils */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:34px}
.tools input,.tools select,.field input,.field select,.field textarea,.search input{background:var(--soft);border:1px solid transparent;border-radius:10px;padding:10px 12px;width:100%;outline:none}
.tools input:focus,.field input:focus,.field select:focus,.field textarea:focus,.search input:focus{border-color:var(--ink)}
.tools input{flex:1 1 240px;width:auto}
.tools select{width:auto;flex:0 1 auto}

/* grille de livres */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:40px 26px}
.book{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;width:100%}
.cover{position:relative;aspect-ratio:2/3;border-radius:4px;overflow:hidden;background:var(--soft);box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px -12px rgba(0,0,0,.25);transition:transform .2s}
.book:hover .cover{transform:translateY(-3px)}
.cover .ph{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;background:var(--soft);color:var(--ink)}
.ph strong{font:400 1.15rem/1.1 var(--serif)}
.ph small{font-size:.75rem;color:var(--muted)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.5)}
.bar i{display:block;height:100%;background:var(--prog)}
.cover .bar i{background:#141414}
.favmark{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--heart);font-size:.75rem}
.meta{padding:12px 0 0}
.meta h3{margin:0;font-weight:500;font-size:.92rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.meta .pc{color:var(--ink)}
.stars{color:var(--ink);letter-spacing:1px;font-size:.78rem;margin-top:4px}
.empty{grid-column:1/-1;text-align:center;padding:70px 10px;color:var(--muted)}
.empty b{display:block;font:400 1.8rem var(--serif);color:var(--ink);margin-bottom:6px}

/* fenêtres */
dialog{border:0;border-radius:18px;padding:0;width:min(620px,94vw);max-height:92vh;background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(3px)}
form{padding:28px;display:grid;gap:16px}
dialog h2{margin:0;font:400 2rem/1.1 var(--serif)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:.78rem;font-weight:500;color:var(--muted);margin-bottom:6px}
.search{display:flex;gap:8px}
.search input{flex:1}
.results{display:grid;gap:4px;max-height:220px;overflow:auto}
.res{display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;border-radius:10px;padding:6px;cursor:pointer;width:100%}
.res:hover{background:var(--soft)}
.res img,.res .noimg{width:34px;height:51px;object-fit:cover;border-radius:2px;background:var(--soft);flex:none}
.res small{color:var(--muted)}
.rate{display:flex;gap:2px;align-items:center}
.rate button{background:none;border:0;cursor:pointer;font-size:1.5rem;line-height:1;padding:0 2px}
.rate .rv{font-size:.85rem;color:var(--muted);margin-left:8px;min-width:2.5em}
.sw{position:relative;display:inline-block;line-height:1}
.sw .se{color:var(--line)}
.sw .sf{position:absolute;left:0;top:0;bottom:0;overflow:hidden;color:var(--ink);white-space:nowrap}
.stars .sw{margin-right:1px}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.foot .danger{margin-right:auto}
#prev{display:block;width:84px;aspect-ratio:2/3;object-fit:cover;border-radius:3px;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.coverrow{display:flex;gap:14px;align-items:flex-start}
.coverbtns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;margin-top:12px;max-height:250px;overflow:auto;padding:3px}
.covers button{border:2px solid transparent;border-radius:6px;padding:2px;background:none;cursor:pointer}
.covers button[aria-pressed=true]{border-color:var(--ink)}
.covers .msg,.results .msg{grid-column:1/-1;margin:0;color:var(--muted);font-size:.88rem}
.covers img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;border-radius:3px}
.langsel{width:auto!important;background:var(--soft);border:1px solid transparent;border-radius:999px;padding:8px 12px;font-size:.85rem}
.cnote{display:flex;align-items:center;gap:12px;margin:10px 0 0;font-size:.88rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);font-weight:500;cursor:pointer;text-decoration:underline;min-height:32px}
.hide{display:none!important}
.picks{display:flex;gap:6px;flex-wrap:wrap}
.pick{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:500;cursor:pointer;color:var(--muted);min-height:36px}
.pick[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.field label small{font-weight:400;opacity:.8}
.pnote{margin:6px 0 0;font-size:.8rem;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pnote .linkbtn{min-height:0;font-size:.8rem}

/* fiche livre */
#view .vtop{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--bg)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;display:grid;place-items:center;font-size:1.1rem}
.iconbtn svg{width:18px;height:18px}
.vbody{padding:4px 28px 32px;display:grid;gap:26px}
.vhero{display:grid;justify-items:center;text-align:center;gap:14px}
.vcover{width:170px;position:relative}
.vcover .cover{box-shadow:0 2px 4px rgba(0,0,0,.08),0 24px 50px -18px rgba(0,0,0,.45)}
.vhero h2{font-size:2.1rem;max-width:22ch}
.vauthor{color:var(--muted);margin-top:-8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--soft);border-radius:999px;padding:5px 12px;font-size:.8rem;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg)}
.vsec{border-top:1px solid var(--line);padding-top:20px;display:grid;gap:12px}
.vsec h4{margin:0;font-size:.75rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.vprog{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem}
.vprog b{font:400 1.9rem/1 var(--serif)}
.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--prog);border-radius:4px}
.upd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upd input{width:110px;background:var(--soft);border:1px solid transparent;border-radius:10px;padding:9px 12px}
.vrate .rate button{font-size:1.9rem}
.vfav[aria-pressed=true]{color:var(--heart);border-color:var(--heart)}
.vquote{margin:0;font:italic 400 1.25rem/1.45 var(--serif);white-space:pre-wrap}
.vdates{color:var(--muted);font-size:.8rem;text-align:center}
.vseries{color:var(--muted);font-size:.85rem;font-weight:500;margin-bottom:-8px}
.mseries{color:var(--muted);font-size:.75rem;margin:0 0 2px!important}
.reads{display:grid;gap:10px}
.readrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:.9rem}
.readrow small{display:block;color:var(--muted);font-size:.8rem;white-space:pre-wrap}
.readrow .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0 4px}
.rform{display:grid;gap:10px;background:var(--soft);border-radius:12px;padding:14px}
.rform input,.rform textarea{background:var(--bg);border:1px solid transparent;border-radius:10px;padding:9px 12px;width:100%}
.vshare{display:flex;justify-content:center}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:12px 14px;margin:-14px 0 24px;font-size:.88rem}
.banner div{display:flex;gap:6px}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:middle}
.syncdot.on{background:#30A46C}.syncdot.err{background:var(--heart)}
#syncdlg form p{margin:0;color:var(--muted);font-size:.88rem}
#syncdlg .sstate{color:var(--ink);font-weight:500}


/* ===== typographie Inter (retouches Figma) ===== */
input,select,textarea{font-size:16px}
h1{font:700 clamp(2.4rem,7vw,3.6rem)/1 var(--sans);letter-spacing:-.04em}
.stats{font-size:.9rem}
.stat b{font-weight:600}
dialog h2{font:700 2.4rem/1.05 var(--sans);letter-spacing:-.035em}
.vhero h2{font:600 1.75rem/1.15 var(--sans);letter-spacing:-.025em;max-width:20ch}
.vauthor{font-size:1rem;margin-top:-6px}
.vprog b{font:400 2.2rem/1 var(--sans);letter-spacing:-.03em}
.vquote{font:400 1.05rem/1.3 var(--sans);font-style:normal;letter-spacing:-.005em}
.vsec h4{font-size:.75rem;font-weight:500;letter-spacing:.1em}
.ph strong{font:600 1rem/1.15 var(--sans);letter-spacing:-.015em}
.meta h3{font-weight:500;font-size:.95rem;letter-spacing:-.01em}
.res b{font-weight:700;letter-spacing:-.01em}
.field label{font-size:.8rem;font-weight:500}
.empty b{font:600 1.4rem var(--sans);letter-spacing:-.02em}
@media (max-width:640px){h1{font-size:2.4rem}.stats{font-size:.8rem}}

/* barre d'onglets en bas (mobile) */
.nav{display:none}
@media (max-width:520px){.row{grid-template-columns:1fr}}
@media (max-width:640px){
  .wrap{padding:max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(var(--navh) + 96px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
  header{margin-bottom:22px;gap:12px}
  h1{font-size:2.4rem}
  .stats{gap:12px;font-size:.78rem;margin-top:8px}
  .actions{order:-1;width:100%;justify-content:flex-end;margin:-8px -10px -14px 0}
  .search{flex-wrap:wrap}
  .search input{flex:1 1 100%}
  .search .langsel{flex:1}
  .actions .btn:not(#add){padding:6px 10px;font-size:.8rem}
  .tabs{display:none}
  .tools{margin-bottom:26px}
  .tools input{flex:1 1 100%}
  .tools select{flex:1 1 0;min-width:0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:30px 16px}
  #add{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom));z-index:6;width:56px;height:56px;padding:0;font-size:0;box-shadow:0 10px 24px -8px rgba(0,0,0,.45)}
  #add::before{content:'+';font-size:1.8rem;font-weight:300;line-height:1}
  .nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(var(--navh) + env(safe-area-inset-bottom));padding:0 max(6px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(6px,env(safe-area-inset-left));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.66rem;font-weight:500;cursor:pointer;min-width:0}
  .nav button svg{width:22px;height:22px}
  .nav button[aria-pressed=true]{color:var(--ink)}
  .nav button span{white-space:nowrap}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}
  form{padding:max(20px,env(safe-area-inset-top)) 20px 0}
  .foot{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:0;border-top:1px solid var(--line)}
  .btn{min-height:42px}
  #view .vtop{padding-top:max(14px,env(safe-area-inset-top))}
  .vbody{padding:4px 22px calc(32px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Ma bibliothèque</h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="add" aria-label="Ajouter un livre">Ajouter un livre</button>
      <button class="btn ghost" id="syncbtn"><span class="syncdot" id="syncdot"></span>Synchro</button>
      <button class="btn ghost" id="export">Exporter</button>
      <button class="btn ghost" id="import">Importer</button>
      <input type="file" id="file" accept="application/json" class="hide">
    </div>
  </header>

  <div class="banner hide" id="banner"><span id="bantext"></span><div><button class="btn primary" id="banexp">Exporter</button><button class="btn ghost" id="banlater">Plus tard</button></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Rechercher un titre ou un auteur" aria-label="Rechercher">
    <select id="gf" aria-label="Filtrer par genre"></select>
    <select id="sort" aria-label="Trier">
      <option value="recent">Ajoutés récemment</option>
      <option value="title">Titre A–Z</option>
      <option value="rating">Meilleures notes</option>
      <option value="pages">Plus de pages</option>
      <option value="series">Par série</option>
    </select>
  </div>
  <main class="grid" id="grid"></main>
</div>
<nav class="nav" id="nav" aria-label="Étagères"></nav>

<dialog id="view" aria-label="Fiche du livre">
  <div class="vtop">
    <button type="button" class="iconbtn" id="vclose" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button type="button" class="btn" id="vedit">Modifier</button>
  </div>
  <div class="vbody" id="vbody"></div>
</dialog>

<dialog id="dlg">
  <form id="form" novalidate>
    <h2 id="dtitle">Ajouter un livre</h2>
    <div id="searchbox" class="field">
      <label for="s">Chercher le livre (choisis l’édition pour avoir la bonne couverture)</label>
      <div class="search">
        <input id="s" type="search" placeholder="Titre, auteur… ou lien Apple Livres">
        <select class="langsel" aria-label="Langue des éditions"><option value="fr">Éditions françaises</option><option value="all">Toutes les langues</option></select>
        <button type="button" class="btn" id="sgo">Chercher</button>
      </div>
      <div class="results" id="results"></div>
    </div>
    <div class="row">
      <div class="field"><label for="f-title">Titre</label><input id="f-title" required></div>
      <div class="field"><label for="f-author">Auteur·ice</label><input id="f-author"></div>
    </div>
    <div class="row">
      <div class="field"><label for="f-series">Série / saga <small>(facultatif)</small></label><input id="f-series" list="serieslist" placeholder="Ex. Harry Potter"><datalist id="serieslist"></datalist></div>
      <div class="field"><label for="f-tome">Tome n°</label><input id="f-tome" type="number" min="0" step="0.5" inputmode="decimal"></div>
    </div>
    <div class="field"><label>Genres <small>(plusieurs choix possibles)</small></label><div class="picks" id="f-genres"></div></div>
    <div class="row">
      <div class="field"><label for="f-pages">Nombre de pages</label><input id="f-pages" type="number" min="0" inputmode="numeric">
        <p class="pnote"><span id="pnote"></span><button type="button" class="linkbtn" id="pfind">Chercher automatiquement</button></p></div>
      <div class="field"><label>Format de lecture</label><div class="picks" id="f-format"><button type="button" class="pick" data-v="physique" aria-pressed="false">Physique</button><button type="button" class="pick" data-v="numerique" aria-pressed="false">Numérique</button></div></div>
    </div>
    <div class="field"><label for="f-cover">Couverture</label>
      <div class="coverrow">
        <img id="prev" class="hide" alt="Aperçu de la couverture" onerror="this.classList.add('hide')" referrerpolicy="no-referrer">
        <div class="coverbtns">
          <button type="button" class="btn" id="cfind">Choisir parmi les couvertures</button>
          <button type="button" class="btn" id="cup">Importer ma photo</button>
          <select class="langsel" aria-label="Langue des éditions"><option value="fr">Éditions françaises</option><option value="all">Toutes les langues</option></select>
          <input type="file" id="cfile" accept="image/*" class="hide">
        </div>
      </div>
      <div class="covers hide" id="covers"></div>
      <p class="cnote hide" id="cnote">Photo importée <button type="button" class="linkbtn" id="cclear">Retirer</button></p>
      <input id="f-cover" type="text" placeholder="…ou colle un lien d’image" style="margin-top:10px">
    </div>
    <div class="row">
      <div class="field"><label for="f-status">Statut</label>
        <select id="f-status"><option value="toread">Pile à lire</option><option value="reading">En cours</option><option value="read">Lu</option></select></div>
      <div class="field" id="cur-wrap"><label for="f-current">Page actuelle</label><input id="f-current" type="number" min="0" inputmode="numeric"></div>
      <div class="field" id="fin-wrap"><label for="f-finished">Terminé le</label><input id="f-finished" type="date"></div>
    </div>
    <div class="row">
      <div class="field"><label>Note <small>(touche la moitié gauche d’une étoile pour une demi-étoile)</small></label><div class="rate" id="rate"></div></div>

<script>
const KEY='bibliotheque-v1';
const GENRES=['Thriller','Policier','Roman','Fantasy','Science-fiction','Romance','Biographie','BD / Manga','Essai','Autre'];
const COLORS=['#FFD54A','#FF8FB1','#7FE0BC','#A9B8FF','#FFB38A','#C9A7FF'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FORMATS={physique:'Physique',numerique:'Numérique'};
/* Nettoie les titres trop longs renvoyés par les boutiques (« - Nouveauté Joël Dicker 2024 », « (French Edition) »…) */
const cleanTitle=t=>String(t||'')
  .replace(/\s+[-–—|]\s+(nouveaut|le nouveau|prix |best.?seller|n°\s?1|num[ée]ro 1|lauréat|le phénomène|le roman|le thriller|édition (collector|limitée|spéciale|augmentée)).*$/i,'')
  .replace(/\s*\((french edition|édition française|ebook|e-book|roman|thriller)\)\s*$/i,'').trim();
const gens=b=>Array.isArray(b.genres)?b.genres:(b.genre?[b.genre]:[]);
function migrate(list){return(Array.isArray(list)?list:[]).map(b=>{
  if(!Array.isArray(b.genres)){b.genres=b.genre?[b.genre]:[];}
  delete b.genre;
  if(b.title)b.title=cleanTitle(b.title)||b.title;
  if(!Array.isArray(b.rereads))b.rereads=[];
  if(!b.updated)b.updated=b.added||Date.now();
  return b;
})}
let books=load(), tab='all', gfilter='', q='', sort='recent', editing=null, rating=0, selGenres=new Set(), fmt='';

function load(){try{return migrate(JSON.parse(localStorage.getItem(KEY))||[])}catch(e){return[]}}
/* livres supprimés (pour que la synchro les supprime aussi sur l'autre appareil) */
const DKEY='bibliotheque-deleted';
let deleted=(()=>{try{return JSON.parse(localStorage.getItem(DKEY))||{}}catch(e){return{}}})();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(books));localStorage.setItem(DKEY,JSON.stringify(deleted))}catch(e){}}
function save(){persist();if(typeof scheduleSync==='function')scheduleSync()}
const touch=b=>{b.updated=Date.now();return b};
const pct=b=>b.status==='read'?100:(b.status==='reading'&&b.pages?Math.min(100,Math.round((b.current||0)/b.pages*100)):0);
const fr=n=>String(n).replace('.',',');
const starSpan=f=>`<span class="sw"><span class="se">★</span><span class="sf" style="width:${f}%">★</span></span>`;
const starsHTML=n=>[1,2,3,4,5].map(i=>starSpan(n>=i?100:n>=i-.5?50:0)).join('');
function rateHTML(n,id){return`<div class="rate" ${id?`id="${id}"`:''}>${[1,2,3,4,5].map(i=>`<button type="button" data-i="${i}" aria-label="${i} étoile${i>1?'s':''}">${starSpan(n>=i?100:n>=i-.5?50:0)}</button>`).join('')}<span class="rv">${n?fr(n)+'/5':''}</span></div>`}
/* note à partir d'un toucher : moitié gauche de l'étoile = demi-étoile */
function rateFrom(e,cur){const b=e.target.closest('[data-i]');if(!b)return null;const r=b.getBoundingClientRect(),i=+b.dataset.i;const n=(e.clientX-r.left)<r.width/2?i-.5:i;return cur===n?0:n}
const ICONS={
  all:'<rect x="4" y="4" width="6" height="16" rx="1"/><rect x="14" y="4" width="6" height="16" rx="1"/>',
  reading:'<path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/>',
  toread:'<rect x="3" y="15" width="18" height="5" rx="1"/><rect x="5" y="9" width="14" height="5" rx="1"/><rect x="7" y="3" width="10" height="5" rx="1"/>',
  read:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/>',
  fav:'<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>'};
const STATUS={toread:'Pile à lire',reading:'En cours',read:'Lu'};
const fdate=t=>t?new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';

/* ---------- rendu ---------- */
function render(){
  const count={all:books.length,reading:0,toread:0,read:0,fav:0};
  books.forEach(b=>{count[b.status]++;if(b.fav)count.fav++});
  const pagesRead=books.reduce((a,b)=>a+(b.status==='read'?(+b.pages||0):b.status==='reading'?(+b.current||0):0)+(+b.pages||0)*(b.rereads||[]).length,0);
  $('#stats').innerHTML=`<span class="stat"><b>${count.read}</b>lus</span><span class="stat"><b>${count.reading}</b>en cours</span><span class="stat"><b>${count.toread}</b>dans la pile</span><span class="stat"><b>${pagesRead.toLocaleString('fr-FR')}</b>pages lues</span>`;
  const tabs=[['all','Tous'],['reading','En cours'],['toread','Pile à lire'],['read','Lus'],['fav','Favoris']];
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button class="tab" data-t="${k}" aria-pressed="${tab===k}">${l}<span>${count[k]}</span></button>`).join('');
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button data-t="${k}" aria-pressed="${tab===k}" aria-label="${l}, ${count[k]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg><span>${l}</span></button>`).join('');
  let list=books.filter(b=>(tab==='all'||(tab==='fav'?b.fav:b.status===tab))&&(!gfilter||gens(b).includes(gfilter))&&(!q||(b.title+' '+b.author+' '+(b.series||'')).toLowerCase().includes(q)));
  const by={recent:(a,b)=>b.added-a.added,title:(a,b)=>a.title.localeCompare(b.title,'fr'),rating:(a,b)=>(b.rating||0)-(a.rating||0),pages:(a,b)=>(b.pages||0)-(a.pages||0),
    series:(a,b)=>(!a.series-!b.series)||(a.series||'').localeCompare(b.series||'','fr')||(a.tome||0)-(b.tome||0)||a.title.localeCompare(b.title,'fr')};
  list.sort(by[sort]);
  $('#grid').innerHTML=list.length?list.map(card).join(''):`<div class="empty"><b>${books.length?'Aucun livre ici':'Ta bibliothèque est vide'}</b>${books.length?'Change de filtre ou ajoute un livre.':'Ajoute ton premier livre avec le bouton en haut.'}</div>`;
}
function card(b){
  const p=pct(b);
  const sub=b.status==='reading'?`<div class="track" style="margin-top:8px"><i style="width:${p}%"></i></div><p class="pc">${p} % lu</p>`:'';
  return `<div>
    <button class="book" data-id="${b.id}" aria-label="Voir ${esc(b.title)}">
      <div class="cover">
        <div class="ph"><strong>${esc(b.title)}</strong><small>${esc(b.author)}</small></div>
        ${b.cover?`<img src="${esc(b.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}
        ${b.fav?'<span class="favmark" aria-label="Favori">♥</span>':''}
      </div>
    </button>
    <div class="meta">${b.series?`<p class="mseries">${esc(b.series)}${b.tome?' · tome '+fr(b.tome):''}</p>`:''}<h3>${esc(b.title)}</h3><p>${esc(b.author)}</p>${sub}
    ${b.rating?`<div class="stars" aria-label="${fr(b.rating)} sur 5">${starsHTML(b.rating)}</div>`:''}
    </div></div>`;
}

/* ---------- fiche livre ---------- */
let viewing=null;
function openView(id){viewing=books.find(b=>b.id===id);if(!viewing)return;rrOpen=false;renderView();if(!$('#view').open)$('#view').showModal();$('#view').scrollTop=0}
function renderView(){
  const b=viewing,p=pct(b);
  const nr=(b.rereads||[]).length+(b.status==='read'?1:0);
  const chips=[...gens(b),FORMATS[b.format]||'',b.pages?b.pages+' pages':'',nr>1?'Lu '+nr+' fois':''].filter(Boolean).map(c=>`<span class="chip">${esc(c)}</span>`).join('')+`<span class="chip on">${STATUS[b.status]}</span>`;
  let prog='';
  if(b.status==='reading')prog=`<section class="vsec"><h4>Progression</h4>
      <div class="vprog"><b>${p} %</b><span>page ${b.current||0}${b.pages?' sur '+b.pages:''}</span></div>
      <div class="track"><i style="width:${p}%"></i></div>
      <div class="upd"><input type="number" id="vpage" min="0" ${b.pages?'max="'+b.pages+'"':''} placeholder="Page" value="${b.current||''}" aria-label="Page actuelle"><button type="button" class="btn" id="vupd">Mettre à jour</button><button type="button" class="btn ghost" id="vdone">J’ai fini</button></div></section>`;
  else if(b.status==='toread')prog=`<section class="vsec"><h4>Dans la pile</h4><div class="upd"><button type="button" class="btn primary" id="vstart">Commencer la lecture</button></div></section>`;
  $('#vbody').innerHTML=`
    <div class="vhero">
      <div class="vcover"><div class="cover"><div class="ph"><strong>${esc(b.title)}</strong><small>${esc(b.author)}</small></div>${b.cover?`<img src="${esc(b.cover)}" alt="Couverture" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div></div>
      ${b.series?`<div class="vseries">${esc(b.series)}${b.tome?' · tome '+fr(b.tome):''}</div>`:''}
      <h2>${esc(b.title)}</h2>
      ${b.author?`<div class="vauthor">${esc(b.author)}</div>`:''}
      <div class="chips">${chips}</div>
    </div>
    ${prog}
    <section class="vsec"><h4>Ma note</h4>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div class="vrate">${rateHTML(b.rating||0,'vrate')}</div>
        <button type="button" class="btn vfav" id="vfav" aria-pressed="${!!b.fav}">${b.fav?'♥ Favori':'♡ Ajouter aux favoris'}</button>
      </div></section>
    ${b.comment?`<section class="vsec"><h4>Mon avis</h4><p class="vquote">${esc(b.comment)}</p></section>`:''}
    ${readsHTML(b)}
    <div class="vshare"><button type="button" class="btn" id="vshare">Partager ma fiche en image</button></div>
    <div class="vdates">Ajouté le ${fdate(b.added)}${b.finished?' · terminé le '+fdate(b.finished):''}</div>`;
}
function updView(changes){Object.assign(viewing,changes);touch(viewing);save();render();renderView()}
/* ---------- relectures ---------- */
let rrRating=0,rrOpen=false;
function readsHTML(b){
  const rr=b.rereads||[];
  if(b.status!=='read'&&!rr.length)return'';
  const first=b.status==='read'?`<div class="readrow"><div>1<sup>re</sup> lecture<small>${b.finished?'terminée le '+fdate(b.finished):'date inconnue'}</small></div><div class="stars">${b.rating?starsHTML(b.rating):''}</div></div>`:'';
  const rows=[...rr].sort((x,y)=>(x.date||0)-(y.date||0)).map((r,i)=>`<div class="readrow"><div>Relecture${rr.length>1?' '+(i+1):''}<small>${r.date?'terminée le '+fdate(r.date):'date inconnue'}${r.comment?'\n'+esc(r.comment):''}</small></div><div style="display:flex;align-items:center;gap:6px"><span class="stars">${r.rating?starsHTML(r.rating):''}</span><button type="button" class="x" data-rrdel="${esc(r.id)}" aria-label="Supprimer cette relecture">×</button></div></div>`).join('');
  const form=rrOpen?`<div class="rform"><div class="field"><label for="rr-date">Terminée le</label><input type="date" id="rr-date" value="${toDateInput(Date.now())}"></div>
      <div class="field"><label>Note de cette relecture</label>${rateHTML(rrRating,'rrrate')}</div>
      <div class="field"><label for="rr-com">Ce que j’en ai pensé cette fois <small>(facultatif)</small></label><textarea id="rr-com" rows="2"></textarea></div>
      <div class="upd"><button type="button" class="btn primary" id="rrsave">Ajouter</button><button type="button" class="btn ghost" id="rrcancel">Annuler</button></div></div>`
    :`<div class="upd"><button type="button" class="btn" id="rradd">J’ai relu ce livre</button></div>`;
  return`<section class="vsec"><h4>Mes lectures</h4><div class="reads">${first}${rows}</div>${form}</section>`;
}

/* ---------- formulaire ---------- */
function renderRate(){
  $('#rate').outerHTML=rateHTML(rating,'rate');
}
function syncCur(){const s=$('#f-status').value;$('#cur-wrap').classList.toggle('hide',s!=='reading');$('#fin-wrap').classList.toggle('hide',s!=='read')}
function renderGenres(){$('#f-genres').innerHTML=GENRES.map(g=>`<button type="button" class="pick" data-g="${esc(g)}" aria-pressed="${selGenres.has(g)}">${esc(g)}</button>`).join('')}
function renderFormat(){$('#f-format').querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===fmt))}
const toDateInput=t=>{if(!t)return'';const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function pnote(t){$('#pnote').textContent=t||''}
function openDlg(id){
  editing=id?books.find(b=>b.id===id):null;
  $('#serieslist').innerHTML=[...new Set(books.map(x=>x.series).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('');
  const b=editing||{title:'',author:'',series:'',tome:'',genres:[],format:'',pages:'',cover:'',status:'toread',current:'',rating:0,fav:0,comment:''};
  $('#dtitle').textContent=editing?'Modifier le livre':'Ajouter un livre';
  $('#searchbox').classList.toggle('hide',!!editing);
  $('#del').classList.toggle('hide',!editing);
  $('#results').innerHTML='';$('#s').value='';$('#covers').innerHTML='';$('#covers').classList.add('hide');
  $('#f-title').value=b.title;$('#f-author').value=b.author;selGenres=new Set(gens(b));renderGenres();fmt=b.format||'';renderFormat();
  $('#f-finished').value=toDateInput(b.finished);$('#f-series').value=b.series||'';$('#f-tome').value=b.tome||'';pnote('');pageTok++;
  $('#f-pages').value=b.pages;$('#f-cover').value=b.cover;$('#f-status').value=b.status;
  $('#f-current').value=b.current;$('#f-fav').value=b.fav?'1':'0';$('#f-comment').value=b.comment;
  rating=b.rating||0;renderRate();syncCur();prev();
  $('#dlg').showModal();
}
function guessGenre(subj=[]){
  const s=[].concat(subj||[]).join(' ').toLowerCase(),g=[];
  if(/thriller|suspense/.test(s))g.push('Thriller');
  if(/polic|polar|detective|mystery|crime|enqu/.test(s))g.push('Policier');
  if(/fantasy|fantastique/.test(s))g.push('Fantasy');
  if(/science.fiction/.test(s))g.push('Science-fiction');
  if(/romance|sentimental/.test(s))g.push('Romance');
  if(/biograph|memoir|mémoires/.test(s))g.push('Biographie');
  if(/comic|manga|graphic|bande dessin/.test(s))g.push('BD / Manga');
  if(/essai|essay/.test(s))g.push('Essai');
  return g.length?g:['Roman'];
}
let lastErr=[];
const ok=r=>{if(!r.ok)throw new Error('code '+r.status);return r.json()};
const cache=new Map();
let olTried=false;
function msg(){
  if(lastErr.some(e=>e.includes('429')))
    return 'Google Livres a atteint sa limite gratuite pour le moment.'+(olTried?' Les autres sources n’ont rien trouvé pour cette recherche.':'')+' Réessaie dans quelques minutes, ou importe ta photo.';
  return lastErr.length
    ?'Connexion impossible ('+lastErr.join(' ; ')+'). Ouvre le fichier dans ton navigateur ou sur GitHub Pages. Tu peux toujours importer ta photo ou coller un lien d’image.'
    :'Aucun résultat pour cette recherche. Essaie avec moins de mots, ou importe ta photo.';
}
let lang='fr';
async function editions(t,l=lang){
  const k=l+'|'+t.toLowerCase();
  if(cache.has(k))return cache.get(k);
  const r=await editions0(t,l);
  if(r.length)cache.set(k,r);
  return r;
}
const sig=()=>({signal:AbortSignal.timeout(10000)});
function jsonp(url){return new Promise((res,rej)=>{
  const cb='_cb'+Date.now()+Math.floor(Math.random()*1e4),sc=document.createElement('script');
  const end=()=>{delete window[cb];sc.remove();clearTimeout(t)};
  const t=setTimeout(()=>{end();rej(new Error('délai dépassé'))},10000);
  window[cb]=d=>{end();res(d)};sc.onerror=()=>{end();rej(new Error('bloqué'))};
  sc.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.head.appendChild(sc);
})}
const apple=url=>fetch(url,sig()).then(ok).catch(()=>jsonp(url));
const fromApple=(x,fr=true)=>({title:cleanTitle(x.trackName),author:x.artistName||'',pages:'',
  cover:(x.artworkUrl100||'').replace('100x100bb','600x600bb'),genre:guessGenre(x.genres),lang:fr?'fr':'',
  info:['Apple Livres',String(x.releaseDate||'').slice(0,4)].filter(Boolean).join(', ')});
async function olFr(t){
  const d=await fetch('https://openlibrary.org/search.json?limit=6&language=fre&fields=key,title,author_name,number_of_pages_median,subject&q='+encodeURIComponent(t),sig()).then(ok);
  const works=(d.docs||[]).slice(0,4);
  const res=await Promise.allSettled(works.map(w=>fetch('https://openlibrary.org'+w.key+'/editions.json?limit=60',sig()).then(ok).then(e=>(e.entries||[])
    .filter(x=>(x.covers||[]).some(c=>c>0)&&(x.languages||[]).some(l=>l.key==='/languages/fre'))
    .map(x=>({title:x.title||w.title,author:(w.author_name||[])[0]||'',pages:x.number_of_pages||w.number_of_pages_median||'',
      cover:'https://covers.openlibrary.org/b/id/'+x.covers.find(c=>c>0)+'-L.jpg',genre:guessGenre(w.subject),lang:'fr',
      info:['Open Library',(x.publishers||[])[0],String(x.publish_date||'').slice(-4)].filter(Boolean).join(', ')})))));
  return res.flatMap(r=>r.value||[]);
}
async function editions0(t,l=lang){
  const fr=l==='fr';
  const gb=fetch('https://www.googleapis.com/books/v1/volumes?maxResults=40&printType=books'+(fr?'&langRestrict=fr':'')+'&q='+encodeURIComponent(t),sig())
    .then(ok).then(d=>(d.items||[]).map(it=>{
      const v=it.volumeInfo||{},im=v.imageLinks||{};
      const isbn=((v.industryIdentifiers||[]).find(i=>i.type==='ISBN_13')||{}).identifier;
      let c=(im.thumbnail||im.smallThumbnail||'').replace('http://','https://').replace('&edge=curl','').replace('zoom=1','zoom=2');
      if(!c&&isbn)c='https://covers.openlibrary.org/b/isbn/'+isbn+'-L.jpg';
      return{title:v.title+(v.subtitle?' : '+v.subtitle:''),author:(v.authors||[])[0]||'',pages:v.pageCount||'',cover:c,genre:guessGenre(v.categories),
        lang:v.language||'',info:[v.publisher,(v.publishedDate||'').slice(0,4),(v.language||'').toUpperCase()].filter(Boolean).join(', ')||'Google Livres'};
    }));
  // Apple Livres : sans clé, boutique française, couvertures officielles des éditeurs
  const ap=apple('https://itunes.apple.com/search?media=ebook&entity=ebook&limit=25&country='+(fr?'fr':'us')+'&term='+encodeURIComponent(t))
    .then(d=>(d.results||[]).filter(x=>x.artworkUrl100).map(x=>fromApple(x,fr)));
  // Open Library : couvertures par œuvre (souvent anglaises), donc seulement en mode « toutes les langues »
  const ol=fr?Promise.resolve([]):fetch('https://openlibrary.org/search.json?limit=12&fields=title,author_name,cover_i,number_of_pages_median,subject&q='+encodeURIComponent(t),sig())
    .then(ok).then(d=>d.docs.map(x=>({title:x.title,author:(x.author_name||[])[0]||'',pages:x.number_of_pages_median||'',
      cover:x.cover_i?'https://covers.openlibrary.org/b/id/'+x.cover_i+'-L.jpg':'',genre:guessGenre(x.subject),lang:'',info:'Open Library'})));
  const [g,a,o]=await Promise.allSettled([gb,ap,ol]);
  lastErr=[['Google Livres',g],['Apple Livres',a],['Open Library',o]].filter(([,x])=>x.status==='rejected').map(([n,x])=>n+' : '+((x.reason&&x.reason.message)||'bloqué'));
  let list=[...(a.value||[]),...(g.value||[]),...(o.value||[])];
  if(fr)list=list.filter(x=>!x.lang||x.lang==='fr');
  olTried=false;
  if(fr&&!list.length){olTried=true;try{list=await olFr(t)}catch(e){lastErr.push('Open Library : '+(e.message||'bloqué'))}}
  list.sort((x,y)=>!!y.cover-!!x.cover);
  if(!list.length&&fr&&!lastErr.length)return editions(t,'all');
  return list;
}

function fill(x){
  $('#f-title').value=cleanTitle(x.title)||x.title;$('#f-author').value=x.author;$('#f-cover').value=x.cover;

/* Nombre de pages : rempli tout seul à partir des données du livre, mais toujours modifiable */
let pageTok=0;
const baseT=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[:(\-–]/)[0].replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
async function lookupPages(title,author){
  const bt=baseT(title),last=String(author||'').split(/[,&]/)[0].trim().split(' ').pop()||'';
  const tries=[
    ()=>fetch('https://www.googleapis.com/books/v1/volumes?maxResults=20&printType=books&langRestrict=fr&q='+encodeURIComponent('intitle:'+bt+(last?' inauthor:'+last:'')),sig()).then(ok)
      .then(d=>(d.items||[]).map(i=>i.volumeInfo||{}).filter(v=>v.pageCount>40&&baseT(v.title)===bt).map(v=>v.pageCount)),
    ()=>fetch('https://openlibrary.org/search.json?limit=5&fields=title,number_of_pages_median&title='+encodeURIComponent(bt)+(last?'&author='+encodeURIComponent(last):''),sig()).then(ok)
      .then(d=>(d.docs||[]).filter(x=>x.number_of_pages_median>40&&baseT(x.title)===bt).map(x=>x.number_of_pages_median)),
    ()=>fetch('https://www.googleapis.com/books/v1/volumes?maxResults=20&printType=books&q='+encodeURIComponent(bt+' '+last),sig()).then(ok)
      .then(d=>(d.items||[]).map(i=>i.volumeInfo||{}).filter(v=>v.pageCount>40&&baseT(v.title)===bt).map(v=>v.pageCount))];
  for(const t of tries){
    try{const l=await t();if(l.length){
      /* la valeur la plus fréquente parmi les éditions trouvées */
      const n={};l.forEach(p=>n[p]=(n[p]||0)+1);return +Object.keys(n).sort((a,b)=>n[b]-n[a]||a-b)[0];
    }}catch(e){}
  }
  return 0;
}
async function autoPages(known){
  const tok=++pageTok,f=$('#f-pages');
  if(known){f.value=known;pnote('Rempli selon l’édition choisie, modifiable.');return}
  const t=$('#f-title').value.trim();if(!t)return;
  f.value='';pnote('Recherche du nombre de pages…');
  const n=await lookupPages(t,$('#f-author').value);
  if(tok!==pageTok)return;
  if(n&&!f.value){f.value=n;pnote('Trouvé automatiquement, modifiable selon ton édition.')}
  else if(!n)pnote('Introuvable, ajoute-le à la main.');
  else pnote('');
}
async function fromAppleLink(t){
  const box=$('#results');
  const m=t.match(/books\.apple\.com\/.*?id(\d{5,})/i)||t.match(/[?&]id=(\d{5,})/);
  if(!m){box.innerHTML='<p class="msg">Ce lien court ne peut pas être lu. Dans Livres, ouvre le livre, touche « Partager » puis « Copier le lien », et colle le lien complet (il commence par books.apple.com).</p>';return}
  box.innerHTML='<p class="msg">Import depuis Apple Livres…</p>';
  const cc=(t.match(/books\.apple\.com\/([a-z]{2})\//i)||[])[1]||'fr';
  let d;try{d=await apple('https://itunes.apple.com/lookup?id='+m[1]+'&country='+cc)}catch(e){d=null}
  const it=d&&(d.results||[])[0];
  if(!it){box.innerHTML='<p class="msg">Impossible de lire ce livre sur Apple Livres. Vérifie ta connexion, ou cherche-le par son titre.</p>';return}
  const x=fromApple(it);fill(x);$('#s').value='';
  box.innerHTML=`<p class="msg">✓ « ${esc(x.title)} » importé depuis Apple Livres.</p>`;
  try{renderCovers([x,...await editions(x.title+' '+x.author)],x)}catch(e){}
}
async function search(){
  const t=$('#s').value.trim();if(!t)return;
  if(/apple\.com|apple\.co\//i.test(t))return fromAppleLink(t);
  const box=$('#results');box.textContent='Recherche…';
  const list=await editions(t);
  if(!list.length){box.innerHTML=`<p class="msg">${esc(msg())}</p>`;return}
  box._docs=list;
  box.innerHTML=list.map((x,i)=>`<button type="button" class="res" data-i="${i}">${x.cover?`<img src="${esc(x.cover)}" alt="" referrerpolicy="no-referrer">`:'<span class="noimg"></span>'}<span><b>${esc(x.title)}</b><br><small>${esc(x.author)}${x.pages?' · '+x.pages+' p.':''} · ${esc(x.info)}</small></span></button>`).join('');
}
function renderCovers(docs,x){
  const box=$('#covers');box.classList.remove('hide');
  const base=t=>String(t).toLowerCase().split(':')[0].trim();
  let list=docs.filter(d=>d.cover);
  if(x){const same=list.filter(d=>base(d.title)===base(x.title));if(same.length>1)list=same}
  const seen=new Set();list=list.filter(d=>!seen.has(d.cover)&&seen.add(d.cover));
  if(!list.length){box.innerHTML=`<p class="msg">${esc(msg())}</p>`;return}
  const cur=$('#f-cover').value;
  box.innerHTML=list.map(d=>`<button type="button" data-c="${esc(d.cover)}" aria-pressed="${d.cover===cur}" title="${esc(d.info)}"><img src="${esc(d.cover)}" alt="Couverture, ${esc(d.info)}" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></button>`).join('');
}

/* ---------- partage en image (format story 1080×1920) ---------- */
function loadImg(src){return new Promise(res=>{
  if(!src)return res(null);
  const im=new Image();if(!src.startsWith('data:'))im.crossOrigin='anonymous';
  const t=setTimeout(()=>res(null),8000);
  im.onload=()=>{clearTimeout(t);res(im)};im.onerror=()=>{clearTimeout(t);res(null)};
  im.src=src;
})}
function wrap(ctx,text,maxW,maxLines){
  const out=[];
  for(const para of String(text).split('\n')){
    let line='';
    for(const w of para.split(/\s+/)){
      const tt=line?line+' '+w:w;
      if(ctx.measureText(tt).width>maxW&&line){out.push(line);line=w}else line=tt;
    }
    out.push(line);
  }
  if(out.length>maxLines){out.length=maxLines;let l=out[maxLines-1];while(l&&ctx.measureText(l+'…').width>maxW)l=l.slice(0,-1);out[maxLines-1]=l.replace(/\s+\S*$/,'')+'…'}
  return out;
}
async function drawCard(b,withCover){
  const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d'),ink='#141414',mut='#8C8C8A',soft='#F5F5F4',F='Inter, system-ui, -apple-system, sans-serif';
  x.fillStyle='#FFFFFF';x.fillRect(0,0,W,H);
  let y=140;
  // couverture
  const cw=400,ch=600,cx=(W-cw)/2;
  x.save();x.shadowColor='rgba(0,0,0,.28)';x.shadowBlur=60;x.shadowOffsetY=30;x.fillStyle=soft;x.fillRect(cx,y,cw,ch);x.restore();
  const im=withCover?await loadImg(b.cover):null;
  if(im){const r=Math.max(cw/im.width,ch/im.height),iw=im.width*r,ih=im.height*r;x.save();x.beginPath();x.rect(cx,y,cw,ch);x.clip();x.drawImage(im,cx+(cw-iw)/2,y+(ch-ih)/2,iw,ih);x.restore()}
  else{x.fillStyle=ink;x.font=`600 40px ${F}`;const L=wrap(x,b.title,cw-70,5);L.forEach((l,i)=>x.fillText(l,cx+35,y+ch-40-(L.length-1-i)*50));}
  y+=ch+120;
  x.textAlign='center';
  if(b.series){x.fillStyle=mut;x.font=`500 34px ${F}`;x.fillText(b.series+(b.tome?' · tome '+fr(b.tome):''),W/2,y);y+=84}
  x.fillStyle=ink;x.font=`700 64px ${F}`;
  wrap(x,b.title,W-180,3).forEach(l=>{x.fillText(l,W/2,y);y+=76});
  if(b.author){x.fillStyle=mut;x.font=`400 40px ${F}`;wrap(x,b.author,W-180,2).forEach(l=>{x.fillText(l,W/2,y);y+=52})}
  y+=40;
  if(b.rating){
    const s=72,gap=14,tw=5*s+4*gap;let sx=(W-tw)/2;x.font=`${s}px ${F}`;x.textAlign='left';
    for(let i=1;i<=5;i++){
      const f=b.rating>=i?1:b.rating>=i-.5?.5:0;
      x.fillStyle='#E2E2E0';x.fillText('★',sx,y+20);
      if(f){x.save();x.beginPath();x.rect(sx,y-s,s*f,s*1.6);x.clip();x.fillStyle=ink;x.fillText('★',sx,y+20);x.restore()}
      sx+=s+gap;
    }
    x.textAlign='center';y+=90;
  }
  const tags=[...gens(b),FORMATS[b.format]].filter(Boolean).join(' · ');
  if(tags){x.fillStyle=mut;x.font=`500 32px ${F}`;x.fillText(tags,W/2,y);y+=70}
  if(b.comment){
    x.fillStyle=ink;x.font=`400 40px ${F}`;
    const lines=wrap(x,'« '+b.comment+' »',W-200,Math.max(2,Math.floor((H-230-y)/56)));
    lines.forEach(l=>{x.fillText(l,W/2,y);y+=56});
  }
  x.fillStyle=mut;x.font=`500 30px ${F}`;
  if(b.finished&&b.status==='read')x.fillText('Lu le '+fdate(b.finished),W/2,H-150);
  x.font=`600 30px ${F}`;x.fillStyle=ink;x.fillText('Ma bibliothèque',W/2,H-100);
  return new Promise((res,rej)=>{try{c.toBlob(bl=>bl?res(bl):rej(new Error('vide')),'image/png')}catch(e){rej(e)}});
}
async function shareImage(b){
  const btn=$('#vshare');if(btn){btn.disabled=true;btn.textContent='Préparation de l’image…'}
  try{
    try{await Promise.all(['400','500','600','700'].map(w=>document.fonts.load(w+' 40px Inter')))}catch(e){}

/* ---------- synchro iPhone / iPad (Supabase) ---------- */
const SCFG='biblio-sync-config';
let sb=null,syncTimer=null,syncing=false,syncAgain=false,lastSync=0,syncErr='';
const scfg=()=>{try{return JSON.parse(localStorage.getItem(SCFG))||{}}catch(e){return{}}};
function loadScript(src){return new Promise((res,rej)=>{if(window.supabase)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)})}
async function sbClient(){
  if(sb)return sb;const c=scfg();if(!c.url||!c.key)return null;
  await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');
  sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'biblio-auth'}});
  return sb;
}
async function session(){const c=await sbClient().catch(()=>null);if(!c)return null;const{data}=await c.auth.getSession();return data.session}
function mergeLib(remote){
  const rb=Array.isArray(remote&&remote.books)?migrate(remote.books):[],rd=(remote&&remote.deleted)||{};
  const del={...rd};for(const[k,v]of Object.entries(deleted))del[k]=Math.max(v,del[k]||0);
  const map=new Map();
  for(const b of [...rb,...books]){const o=map.get(b.id);if(!o||(b.updated||0)>(o.updated||0))map.set(b.id,b)}
  const out=[...map.values()].filter(b=>!(del[b.id]&&del[b.id]>=(b.updated||0)));
  return{books:out,deleted:del};
}
async function syncNow(){
  if(syncing){syncAgain=true;return}
  const ses=await session();if(!ses){syncUI();return}
  syncing=true;syncErr='';syncUI();
  try{
    const{data,error}=await sb.from('libraries').select('data').eq('user_id',ses.user.id).maybeSingle();
    if(error)throw error;
    const m=mergeLib(data&&data.data);
    books=m.books;deleted=m.deleted;persist();render();
    if(viewing){const v=books.find(b=>b.id===viewing.id);if(v&&$('#view').open){viewing=v;if(!rrOpen)renderView()}}
    const{error:e2}=await sb.from('libraries').upsert({user_id:ses.user.id,data:{books,deleted},updated_at:new Date().toISOString()});
    if(e2)throw e2;
    lastSync=Date.now();
  }catch(e){syncErr=(e&&e.message)||'erreur'}
  syncing=false;syncUI();
  if(syncAgain){syncAgain=false;syncNow()}
}
function scheduleSync(){if(!scfg().url)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1500)}
async function syncUI(){
  const ses=scfg().url?await session().catch(()=>null):null;
  const dot=$('#syncdot');dot.className='syncdot'+(ses?(syncErr?' err':' on'):'');
  const st=!scfg().url?'non configurée':!ses?'déconnectée':syncing?'synchronisation…':syncErr?'erreur : '+syncErr:lastSync?'à jour ('+new Date(lastSync).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+')':'connectée';
  $('#sstate').textContent=st+(ses?' · '+ses.user.email:'');
  $('#scfg').classList.toggle('hide',!!ses);$('#slogin').classList.toggle('hide',!!ses);
  $('#ssignup').classList.toggle('hide',!!ses);$('#slogout').classList.toggle('hide',!ses);

async function syncLogin(signup){
  const url=$('#s-url').value.trim().replace(/\/+$/,''),key=$('#s-key').value.trim(),email=$('#s-email').value.trim(),pass=$('#s-pass').value;
  const m=$('#smsg');
  if(!url||!key){m.textContent='Colle d’abord l’adresse et la clé de ton projet Supabase.';return}
  if(!email||pass.length<6){m.textContent='Entre ton e-mail et un mot de passe d’au moins 6 caractères.';return}
  const c=scfg();if(c.url!==url||c.key!==key){localStorage.setItem(SCFG,JSON.stringify({url,key}));sb=null}
  m.textContent='Connexion…';
  try{
    const cl=await sbClient();
    const{data,error}=signup?await cl.auth.signUp({email,password:pass}):await cl.auth.signInWithPassword({email,password:pass});
    if(error)throw error;
    if(signup&&!data.session){m.textContent='Compte créé. Ouvre l’e-mail de confirmation, puis reviens ici et touche « Se connecter ».';return}
    m.textContent='';$('#s-pass').value='';await syncNow();
  }catch(e){m.textContent=/invalid login/i.test(e.message||'')?'E-mail ou mot de passe incorrect.':/not confirmed/i.test(e.message||'')?'Confirme d’abord ton compte avec le lien reçu par e-mail.':'Impossible : '+(e.message||e)}
}
$('#syncbtn').onclick=()=>{const c=scfg();$('#s-url').value=c.url||'';$('#s-key').value=c.key||'';$('#smsg').textContent='';syncUI();$('#syncdlg').showModal()};
$('#sclose').onclick=()=>$('#syncdlg').close();
$('#syncform').onsubmit=e=>e.preventDefault();
$('#sgo2').onclick=async()=>{if(await session().catch(()=>null))syncNow();else syncLogin(false)};
$('#ssignup').onclick=()=>syncLogin(true);
$('#slogout').onclick=async()=>{if(!confirm('Te déconnecter ? Tes livres restent sur cet appareil.'))return;try{await sb.auth.signOut()}catch(e){}lastSync=0;syncUI()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&scfg().url)syncNow()});

/* ---------- rappel de sauvegarde (si la synchro n'est pas activée) ---------- */
function checkBanner(synced){
  const last=+localStorage.getItem('biblio-lastexport')||0,snooze=+localStorage.getItem('biblio-snooze')||0,now=Date.now(),D=864e5;
  const show=!synced&&books.length>0&&now-last>7*D&&now>snooze;
  $('#banner').classList.toggle('hide',!show);
  if(show)$('#bantext').textContent=last?`Dernière sauvegarde il y a ${Math.floor((now-last)/D)} jours. Exporte tes livres pour ne rien perdre.`:'Tes livres ne sont enregistrés que sur cet appareil. Exporte-les pour ne rien perdre, ou active la synchro.';
}
$('#banexp').onclick=()=>$('#export').click();
$('#banlater').onclick=()=>{localStorage.setItem('biblio-snooze',Date.now()+3*864e5);checkBanner()};

/* ---------- init ---------- */
$('#gf').innerHTML='<option value="">Tous les genres</option>'+GENRES.map(g=>`<option>${g}</option>`).join('');
persist();render();
if(scfg().url)syncNow();else syncUI();
/* Mise à jour automatique : dès qu'une nouvelle version est publiée, l'appli se recharge toute seule */
if('serviceWorker' in navigator){
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded){reloaded=true;location.reload()}});
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>{
    const check=()=>r.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
  }).catch(()=>{}));
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
