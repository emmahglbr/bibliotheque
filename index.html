<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ma bibliothèque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --soft:#F5F5F4; --ink:#141414; --muted:#8C8C8A; --line:#EAEAE8;
  --accent:#141414; --accent-ink:#FFFFFF; --heart:#E5484D; --prog:#141414;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --navh:64px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E0E0E;--soft:#1A1A1A;--ink:#F2F2F0;--muted:#8A8A88;--line:#262626;--accent:#F2F2F0;--accent-ink:#0E0E0E;--prog:#F2F2F0}
}
*{box-sizing:border-box}
html{color-scheme:light dark;-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}

/* en-tête */
header{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end;margin-bottom:36px}
h1{font:400 clamp(2.4rem,6vw,3.4rem)/1 var(--serif);margin:0;letter-spacing:-.01em}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:.85rem}
.stat b{color:var(--ink);font-weight:600;margin-right:4px}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* boutons */
.btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;font-size:.9rem;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{opacity:.85}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:transparent}
.btn.danger{border-color:transparent;color:var(--heart)}
.btn.danger:hover{border-color:var(--heart)}

/* onglets (ordinateur) */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{border:0;background:none;padding:0 0 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.tab span{margin-left:6px;font-size:.8em;opacity:.7}

/* outils */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:34px}
.tools input,.tools select,.field input,.field select,.field textarea,.search input{background:var(--soft);border:1px solid transparent;border-radius:10px;padding:10px 12px;width:100%;outline:none}
.tools input:focus,.field input:focus,.field select:focus,.field textarea:focus,.search input:focus{border-color:var(--ink)}
.tools input{flex:1 1 240px;width:auto}
.tools select{width:auto;flex:0 1 auto}

/* grille de livres */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:40px 26px}
.book{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;width:100%}
.cover{position:relative;aspect-ratio:2/3;border-radius:4px;overflow:hidden;background:var(--soft);box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px -12px rgba(0,0,0,.25);transition:transform .2s}
.book:hover .cover{transform:translateY(-3px)}
.cover .ph{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;background:var(--soft);color:var(--ink)}
.ph strong{font:400 1.15rem/1.1 var(--serif)}
.ph small{font-size:.75rem;color:var(--muted)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.5)}
.bar i{display:block;height:100%;background:var(--prog)}
.cover .bar i{background:#141414}
.favmark{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--heart);font-size:.75rem}
.meta{padding:12px 0 0}
.meta h3{margin:0;font-weight:500;font-size:.92rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.meta .pc{color:var(--ink)}
.stars{color:var(--ink);letter-spacing:1px;font-size:.78rem;margin-top:4px}
.empty{grid-column:1/-1;text-align:center;padding:70px 10px;color:var(--muted)}
.empty b{display:block;font:400 1.8rem var(--serif);color:var(--ink);margin-bottom:6px}

/* fenêtres */
dialog{border:0;border-radius:18px;padding:0;width:min(620px,94vw);max-height:92vh;background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(3px)}
form{padding:28px;display:grid;gap:16px}
dialog h2{margin:0;font:400 2rem/1.1 var(--serif)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:.78rem;font-weight:500;color:var(--muted);margin-bottom:6px}
.search{display:flex;gap:8px}
.search input{flex:1}
.results{display:grid;gap:4px;max-height:220px;overflow:auto}
.res{display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;border-radius:10px;padding:6px;cursor:pointer;width:100%}
.res:hover{background:var(--soft)}
.res img,.res .noimg{width:34px;height:51px;object-fit:cover;border-radius:2px;background:var(--soft);flex:none}
.res small{color:var(--muted)}
.rate{display:flex;gap:2px}
.rate button{background:none;border:0;cursor:pointer;font-size:1.5rem;line-height:1;color:var(--line);padding:0 2px}
.rate button.on{color:var(--ink)}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.foot .danger{margin-right:auto}
#prev{display:block;width:84px;aspect-ratio:2/3;object-fit:cover;border-radius:3px;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.coverrow{display:flex;gap:14px;align-items:flex-start}
.coverbtns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;margin-top:12px;max-height:250px;overflow:auto;padding:3px}
.covers button{border:2px solid transparent;border-radius:6px;padding:2px;background:none;cursor:pointer}
.covers button[aria-pressed=true]{border-color:var(--ink)}
.covers .msg,.results .msg{grid-column:1/-1;margin:0;color:var(--muted);font-size:.88rem}
.covers img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;border-radius:3px}
.langsel{width:auto!important;background:var(--soft);border:1px solid transparent;border-radius:999px;padding:8px 12px;font-size:.85rem}
.cnote{display:flex;align-items:center;gap:12px;margin:10px 0 0;font-size:.88rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);font-weight:500;cursor:pointer;text-decoration:underline;min-height:32px}
.hide{display:none!important}

/* fiche livre */
#view .vtop{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--bg)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;display:grid;place-items:center;font-size:1.1rem}
.iconbtn svg{width:18px;height:18px}
.vbody{padding:4px 28px 32px;display:grid;gap:26px}
.vhero{display:grid;justify-items:center;text-align:center;gap:14px}
.vcover{width:170px;position:relative}
.vcover .cover{box-shadow:0 2px 4px rgba(0,0,0,.08),0 24px 50px -18px rgba(0,0,0,.45)}
.vhero h2{font-size:2.1rem;max-width:22ch}
.vauthor{color:var(--muted);margin-top:-8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--soft);border-radius:999px;padding:5px 12px;font-size:.8rem;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg)}
.vsec{border-top:1px solid var(--line);padding-top:20px;display:grid;gap:12px}
.vsec h4{margin:0;font-size:.75rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.vprog{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem}
.vprog b{font:400 1.9rem/1 var(--serif)}
.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--prog);border-radius:4px}
.upd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upd input{width:110px;background:var(--soft);border:1px solid transparent;border-radius:10px;padding:9px 12px}
.vrate .rate button{font-size:1.9rem}
.vfav[aria-pressed=true]{color:var(--heart);border-color:var(--heart)}
.vquote{margin:0;font:italic 400 1.25rem/1.45 var(--serif);white-space:pre-wrap}
.vdates{color:var(--muted);font-size:.8rem;text-align:center}

/* barre d'onglets en bas (mobile) */
.nav{display:none}
@media (max-width:520px){.row{grid-template-columns:1fr}}
@media (max-width:640px){
  .wrap{padding:max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(var(--navh) + 96px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
  header{margin-bottom:22px;gap:12px}
  h1{font-size:2.4rem}
  .stats{gap:12px;font-size:.78rem;margin-top:8px}
  .actions{order:-1;width:100%;justify-content:flex-end;margin:-8px -10px -14px 0}
  .search{flex-wrap:wrap}
  .search input{flex:1 1 100%}
  .search .langsel{flex:1}
  .actions .btn:not(#add){padding:6px 10px;font-size:.8rem}
  .tabs{display:none}
  .tools{margin-bottom:26px}
  .tools input{flex:1 1 100%}
  .tools select{flex:1 1 0;min-width:0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:30px 16px}
  #add{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom));z-index:6;width:56px;height:56px;padding:0;font-size:0;box-shadow:0 10px 24px -8px rgba(0,0,0,.45)}
  #add::before{content:'+';font-size:1.8rem;font-weight:300;line-height:1}
  .nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(var(--navh) + env(safe-area-inset-bottom));padding:0 max(6px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(6px,env(safe-area-inset-left));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.66rem;font-weight:500;cursor:pointer;min-width:0}
  .nav button svg{width:22px;height:22px}
  .nav button[aria-pressed=true]{color:var(--ink)}
  .nav button span{white-space:nowrap}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}
  form{padding:max(20px,env(safe-area-inset-top)) 20px 0}
  .foot{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:0;border-top:1px solid var(--line)}
  .btn{min-height:42px}
  #view .vtop{padding-top:max(14px,env(safe-area-inset-top))}
  .vbody{padding:4px 22px calc(32px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Ma bibliothèque</h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="add" aria-label="Ajouter un livre">Ajouter un livre</button>
      <button class="btn ghost" id="export">Exporter</button>
      <button class="btn ghost" id="import">Importer</button>
      <input type="file" id="file" accept="application/json" class="hide">
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Rechercher un titre ou un auteur" aria-label="Rechercher">
    <select id="gf" aria-label="Filtrer par genre"></select>
    <select id="sort" aria-label="Trier">
      <option value="recent">Ajoutés récemment</option>
      <option value="title">Titre A–Z</option>
      <option value="rating">Meilleures notes</option>
      <option value="pages">Plus de pages</option>
    </select>
  </div>
  <main class="grid" id="grid"></main>
</div>
<nav class="nav" id="nav" aria-label="Étagères"></nav>

<dialog id="view" aria-label="Fiche du livre">
  <div class="vtop">
    <button type="button" class="iconbtn" id="vclose" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button type="button" class="btn" id="vedit">Modifier</button>
  </div>
  <div class="vbody" id="vbody"></div>
</dialog>

<dialog id="dlg">
  <form id="form" novalidate>
    <h2 id="dtitle">Ajouter un livre</h2>
    <div id="searchbox" class="field">
      <label for="s">Chercher le livre (choisis l’édition pour avoir la bonne couverture)</label>
      <div class="search">
        <input id="s" type="search" placeholder="Titre, auteur…">
        <select class="langsel" aria-label="Langue des éditions"><option value="fr">Éditions françaises</option><option value="all">Toutes les langues</option></select>
        <button type="button" class="btn" id="sgo">Chercher</button>
      </div>
      <div class="results" id="results"></div>
    </div>
    <div class="row">
      <div class="field"><label for="f-title">Titre</label><input id="f-title" required></div>
      <div class="field"><label for="f-author">Auteur·ice</label><input id="f-author"></div>
    </div>
    <div class="row">
      <div class="field"><label for="f-genre">Genre</label><select id="f-genre"></select></div>
      <div class="field"><label for="f-pages">Nombre de pages</label><input id="f-pages" type="number" min="0"></div>
    </div>
    <div class="field"><label for="f-cover">Couverture</label>
      <div class="coverrow">
        <img id="prev" class="hide" alt="Aperçu de la couverture" onerror="this.classList.add('hide')" referrerpolicy="no-referrer">
        <div class="coverbtns">
          <button type="button" class="btn" id="cfind">Choisir parmi les couvertures</button>
          <button type="button" class="btn" id="cup">Importer ma photo</button>
          <select class="langsel" aria-label="Langue des éditions"><option value="fr">Éditions françaises</option><option value="all">Toutes les langues</option></select>
          <input type="file" id="cfile" accept="image/*" class="hide">
        </div>
      </div>
      <div class="covers hide" id="covers"></div>
      <p class="cnote hide" id="cnote">Photo importée <button type="button" class="linkbtn" id="cclear">Retirer</button></p>
      <input id="f-cover" type="text" placeholder="…ou colle un lien d’image" style="margin-top:10px">
    </div>
    <div class="row">
      <div class="field"><label for="f-status">Statut</label>
        <select id="f-status"><option value="toread">Pile à lire</option><option value="reading">En cours</option><option value="read">Lu</option></select></div>
      <div class="field" id="cur-wrap"><label for="f-current">Page actuelle</label><input id="f-current" type="number" min="0"></div>
    </div>
    <div class="row">
      <div class="field"><label>Note</label><div class="rate" id="rate"></div></div>
      <div class="field"><label for="f-fav">Favori</label><select id="f-fav"><option value="0">Non</option><option value="1">Oui</option></select></div>
    </div>
    <div class="field"><label for="f-comment">Commentaire</label><textarea id="f-comment" rows="3" placeholder="Ce que j’en ai pensé…"></textarea></div>
    <div class="foot">
      <button type="button" class="btn danger hide" id="del">Supprimer</button>
      <button type="button" class="btn" id="cancel">Annuler</button>
      <button type="button" class="btn primary" id="save">Enregistrer</button>
    </div>
  </form>
</dialog>

<script>
const KEY='bibliotheque-v1';
const GENRES=['Thriller','Policier','Roman','Fantasy','Science-fiction','Romance','Biographie','BD / Manga','Essai','Autre'];
const COLORS=['#FFD54A','#FF8FB1','#7FE0BC','#A9B8FF','#FFB38A','#C9A7FF'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let books=load(), tab='all', gfilter='', q='', sort='recent', editing=null, rating=0;

function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(books))}catch(e){}}
const pct=b=>b.status==='read'?100:(b.status==='reading'&&b.pages?Math.min(100,Math.round((b.current||0)/b.pages*100)):0);
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const ICONS={
  all:'<rect x="4" y="4" width="6" height="16" rx="1"/><rect x="14" y="4" width="6" height="16" rx="1"/>',
  reading:'<path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/>',
  toread:'<rect x="3" y="15" width="18" height="5" rx="1"/><rect x="5" y="9" width="14" height="5" rx="1"/><rect x="7" y="3" width="10" height="5" rx="1"/>',
  read:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/>',
  fav:'<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>'};
const STATUS={toread:'Pile à lire',reading:'En cours',read:'Lu'};
const fdate=t=>t?new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';

/* ---------- rendu ---------- */
function render(){
  const count={all:books.length,reading:0,toread:0,read:0,fav:0};
  books.forEach(b=>{count[b.status]++;if(b.fav)count.fav++});
  const pagesRead=books.reduce((a,b)=>a+(b.status==='read'?(+b.pages||0):b.status==='reading'?(+b.current||0):0),0);
  $('#stats').innerHTML=`<span class="stat"><b>${count.read}</b>lus</span><span class="stat"><b>${count.reading}</b>en cours</span><span class="stat"><b>${count.toread}</b>dans la pile</span><span class="stat"><b>${pagesRead.toLocaleString('fr-FR')}</b>pages lues</span>`;
  const tabs=[['all','Tous'],['reading','En cours'],['toread','Pile à lire'],['read','Lus'],['fav','Favoris']];
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button class="tab" data-t="${k}" aria-pressed="${tab===k}">${l}<span>${count[k]}</span></button>`).join('');
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button data-t="${k}" aria-pressed="${tab===k}" aria-label="${l}, ${count[k]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg><span>${l}</span></button>`).join('');
  let list=books.filter(b=>(tab==='all'||(tab==='fav'?b.fav:b.status===tab))&&(!gfilter||b.genre===gfilter)&&(!q||(b.title+' '+b.author).toLowerCase().includes(q)));
  const by={recent:(a,b)=>b.added-a.added,title:(a,b)=>a.title.localeCompare(b.title,'fr'),rating:(a,b)=>(b.rating||0)-(a.rating||0),pages:(a,b)=>(b.pages||0)-(a.pages||0)};
  list.sort(by[sort]);
  $('#grid').innerHTML=list.length?list.map(card).join(''):`<div class="empty"><b>${books.length?'Aucun livre ici':'Ta bibliothèque est vide'}</b>${books.length?'Change de filtre ou ajoute un livre.':'Ajoute ton premier livre avec le bouton en haut.'}</div>`;
}
function card(b){
  const p=pct(b);
  const sub=b.status==='reading'?`<div class="track" style="margin-top:8px"><i style="width:${p}%"></i></div><p class="pc">${p} % lu</p>`:'';
  return `<div>
    <button class="book" data-id="${b.id}" aria-label="Voir ${esc(b.title)}">
      <div class="cover">
        <div class="ph"><strong>${esc(b.title)}</strong><small>${esc(b.author)}</small></div>
        ${b.cover?`<img src="${esc(b.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}
        ${b.fav?'<span class="favmark" aria-label="Favori">♥</span>':''}
      </div>
    </button>
    <div class="meta"><h3>${esc(b.title)}</h3><p>${esc(b.author)}</p>${sub}
    ${b.rating?`<div class="stars" aria-label="${b.rating} sur 5">${stars(b.rating)}</div>`:''}
    </div></div>`;
}

/* ---------- fiche livre ---------- */
let viewing=null;
function openView(id){viewing=books.find(b=>b.id===id);if(!viewing)return;renderView();if(!$('#view').open)$('#view').showModal();$('#view').scrollTop=0}
function renderView(){
  const b=viewing,p=pct(b);
  const chips=[b.genre,b.pages?b.pages+' pages':''].filter(Boolean).map(c=>`<span class="chip">${esc(c)}</span>`).join('')+`<span class="chip on">${STATUS[b.status]}</span>`;
  let prog='';
  if(b.status==='reading')prog=`<section class="vsec"><h4>Progression</h4>
      <div class="vprog"><b>${p} %</b><span>page ${b.current||0}${b.pages?' sur '+b.pages:''}</span></div>
      <div class="track"><i style="width:${p}%"></i></div>
      <div class="upd"><input type="number" id="vpage" min="0" ${b.pages?'max="'+b.pages+'"':''} placeholder="Page" value="${b.current||''}" aria-label="Page actuelle"><button type="button" class="btn" id="vupd">Mettre à jour</button><button type="button" class="btn ghost" id="vdone">J’ai fini</button></div></section>`;
  else if(b.status==='toread')prog=`<section class="vsec"><h4>Dans la pile</h4><div class="upd"><button type="button" class="btn primary" id="vstart">Commencer la lecture</button></div></section>`;
  $('#vbody').innerHTML=`
    <div class="vhero">
      <div class="vcover"><div class="cover"><div class="ph"><strong>${esc(b.title)}</strong><small>${esc(b.author)}</small></div>${b.cover?`<img src="${esc(b.cover)}" alt="Couverture" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div></div>
      <h2>${esc(b.title)}</h2>
      ${b.author?`<div class="vauthor">${esc(b.author)}</div>`:''}
      <div class="chips">${chips}</div>
    </div>
    ${prog}
    <section class="vsec"><h4>Ma note</h4>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div class="vrate"><div class="rate" id="vrate">${[1,2,3,4,5].map(i=>`<button type="button" data-r="${i}" class="${i<=(b.rating||0)?'on':''}" aria-label="${i} étoile${i>1?'s':''}">★</button>`).join('')}</div></div>
        <button type="button" class="btn vfav" id="vfav" aria-pressed="${!!b.fav}">${b.fav?'♥ Favori':'♡ Ajouter aux favoris'}</button>
      </div></section>
    ${b.comment?`<section class="vsec"><h4>Mon avis</h4><p class="vquote">${esc(b.comment)}</p></section>`:''}
    <div class="vdates">Ajouté le ${fdate(b.added)}${b.finished?' · terminé le '+fdate(b.finished):''}</div>`;
}
function updView(changes){Object.assign(viewing,changes);save();render();renderView()}

/* ---------- formulaire ---------- */
function renderRate(){
  $('#rate').innerHTML=[1,2,3,4,5].map(i=>`<button type="button" data-r="${i}" class="${i<=rating?'on':''}" aria-label="${i} étoile${i>1?'s':''}">★</button>`).join('');
}
function syncCur(){$('#cur-wrap').classList.toggle('hide',$('#f-status').value!=='reading')}
function openDlg(id){
  editing=id?books.find(b=>b.id===id):null;
  const b=editing||{title:'',author:'',genre:'Roman',pages:'',cover:'',status:'toread',current:'',rating:0,fav:0,comment:''};
  $('#dtitle').textContent=editing?'Modifier le livre':'Ajouter un livre';
  $('#searchbox').classList.toggle('hide',!!editing);
  $('#del').classList.toggle('hide',!editing);
  $('#results').innerHTML='';$('#s').value='';$('#covers').innerHTML='';$('#covers').classList.add('hide');
  $('#f-title').value=b.title;$('#f-author').value=b.author;$('#f-genre').value=b.genre;
  $('#f-pages').value=b.pages;$('#f-cover').value=b.cover;$('#f-status').value=b.status;
  $('#f-current').value=b.current;$('#f-fav').value=b.fav?'1':'0';$('#f-comment').value=b.comment;
  rating=b.rating||0;renderRate();syncCur();prev();
  $('#dlg').showModal();
}
function guessGenre(subj=[]){
  const s=[].concat(subj||[]).join(' ').toLowerCase();
  if(/thriller/.test(s))return'Thriller';
  if(/polic|polar|detective|mystery|crime|enqu/.test(s))return'Policier';
  if(/suspense/.test(s))return'Thriller';
  if(/fantasy|fantastique/.test(s))return'Fantasy';
  if(/science.fiction/.test(s))return'Science-fiction';
  if(/romance|sentimental/.test(s))return'Romance';
  if(/biograph|memoir|mémoires/.test(s))return'Biographie';
  if(/comic|manga|graphic|bande dessin/.test(s))return'BD / Manga';
  if(/essai|essay/.test(s))return'Essai';
  return'Roman';
}
let lastErr=[];
const ok=r=>{if(!r.ok)throw new Error('code '+r.status);return r.json()};
const cache=new Map();
let olTried=false;
function msg(){
  if(lastErr.some(e=>e.includes('429')))
    return 'Google Livres a atteint sa limite gratuite pour le moment.'+(olTried?' Les autres sources n’ont rien trouvé pour cette recherche.':'')+' Réessaie dans quelques minutes, ou importe ta photo.';
  return lastErr.length
    ?'Connexion impossible ('+lastErr.join(' ; ')+'). Ouvre le fichier dans ton navigateur ou sur GitHub Pages. Tu peux toujours importer ta photo ou coller un lien d’image.'
    :'Aucun résultat pour cette recherche. Essaie avec moins de mots, ou importe ta photo.';
}
let lang='fr';
async function editions(t,l=lang){
  const k=l+'|'+t.toLowerCase();
  if(cache.has(k))return cache.get(k);
  const r=await editions0(t,l);
  if(r.length)cache.set(k,r);
  return r;
}
const sig=()=>({signal:AbortSignal.timeout(10000)});
async function olFr(t){
  const d=await fetch('https://openlibrary.org/search.json?limit=6&language=fre&fields=key,title,author_name,number_of_pages_median,subject&q='+encodeURIComponent(t),sig()).then(ok);
  const works=(d.docs||[]).slice(0,4);
  const res=await Promise.allSettled(works.map(w=>fetch('https://openlibrary.org'+w.key+'/editions.json?limit=60',sig()).then(ok).then(e=>(e.entries||[])
    .filter(x=>(x.covers||[]).some(c=>c>0)&&(x.languages||[]).some(l=>l.key==='/languages/fre'))
    .map(x=>({title:x.title||w.title,author:(w.author_name||[])[0]||'',pages:x.number_of_pages||w.number_of_pages_median||'',
      cover:'https://covers.openlibrary.org/b/id/'+x.covers.find(c=>c>0)+'-L.jpg',genre:guessGenre(w.subject),lang:'fr',
      info:['Open Library',(x.publishers||[])[0],String(x.publish_date||'').slice(-4)].filter(Boolean).join(', ')})))));
  return res.flatMap(r=>r.value||[]);
}
async function editions0(t,l=lang){
  const fr=l==='fr';
  const gb=fetch('https://www.googleapis.com/books/v1/volumes?maxResults=40&printType=books'+(fr?'&langRestrict=fr':'')+'&q='+encodeURIComponent(t),sig())
    .then(ok).then(d=>(d.items||[]).map(it=>{
      const v=it.volumeInfo||{},im=v.imageLinks||{};
      const isbn=((v.industryIdentifiers||[]).find(i=>i.type==='ISBN_13')||{}).identifier;
      let c=(im.thumbnail||im.smallThumbnail||'').replace('http://','https://').replace('&edge=curl','').replace('zoom=1','zoom=2');
      if(!c&&isbn)c='https://covers.openlibrary.org/b/isbn/'+isbn+'-L.jpg';
      return{title:v.title+(v.subtitle?' : '+v.subtitle:''),author:(v.authors||[])[0]||'',pages:v.pageCount||'',cover:c,genre:guessGenre(v.categories),
        lang:v.language||'',info:[v.publisher,(v.publishedDate||'').slice(0,4),(v.language||'').toUpperCase()].filter(Boolean).join(', ')||'Google Livres'};
    }));
  // Apple Livres : sans clé, boutique française, couvertures officielles des éditeurs
  const ap=fetch('https://itunes.apple.com/search?media=ebook&entity=ebook&limit=25&country='+(fr?'fr':'us')+'&term='+encodeURIComponent(t),sig())
    .then(ok).then(d=>(d.results||[]).filter(x=>x.artworkUrl100).map(x=>({title:x.trackName,author:x.artistName||'',pages:'',
      cover:x.artworkUrl100.replace('100x100bb','600x600bb'),genre:guessGenre(x.genres),lang:fr?'fr':'',
      info:['Apple Livres',String(x.releaseDate||'').slice(0,4)].filter(Boolean).join(', ')})));
  // Open Library : couvertures par œuvre (souvent anglaises), donc seulement en mode « toutes les langues »
  const ol=fr?Promise.resolve([]):fetch('https://openlibrary.org/search.json?limit=12&fields=title,author_name,cover_i,number_of_pages_median,subject&q='+encodeURIComponent(t),sig())
    .then(ok).then(d=>d.docs.map(x=>({title:x.title,author:(x.author_name||[])[0]||'',pages:x.number_of_pages_median||'',
      cover:x.cover_i?'https://covers.openlibrary.org/b/id/'+x.cover_i+'-L.jpg':'',genre:guessGenre(x.subject),lang:'',info:'Open Library'})));
  const [g,a,o]=await Promise.allSettled([gb,ap,ol]);
  lastErr=[['Google Livres',g],['Apple Livres',a],['Open Library',o]].filter(([,x])=>x.status==='rejected').map(([n,x])=>n+' : '+((x.reason&&x.reason.message)||'bloqué'));
  let list=[...(a.value||[]),...(g.value||[]),...(o.value||[])];
  if(fr)list=list.filter(x=>!x.lang||x.lang==='fr');
  olTried=false;
  if(fr&&!list.length){olTried=true;try{list=await olFr(t)}catch(e){lastErr.push('Open Library : '+(e.message||'bloqué'))}}
  list.sort((x,y)=>!!y.cover-!!x.cover);
  if(!list.length&&fr&&!lastErr.length)return editions(t,'all');
  return list;
}

async function search(){
  const t=$('#s').value.trim();if(!t)return;
  const box=$('#results');box.textContent='Recherche…';
  const list=await editions(t);
  if(!list.length){box.innerHTML=`<p class="msg">${esc(msg())}</p>`;return}
  box._docs=list;
  box.innerHTML=list.map((x,i)=>`<button type="button" class="res" data-i="${i}">${x.cover?`<img src="${esc(x.cover)}" alt="" referrerpolicy="no-referrer">`:'<span class="noimg"></span>'}<span><b>${esc(x.title)}</b><br><small>${esc(x.author)}${x.pages?' · '+x.pages+' p.':''} · ${esc(x.info)}</small></span></button>`).join('');
}
function renderCovers(docs,x){
  const box=$('#covers');box.classList.remove('hide');
  const base=t=>String(t).toLowerCase().split(':')[0].trim();
  let list=docs.filter(d=>d.cover);
  if(x){const same=list.filter(d=>base(d.title)===base(x.title));if(same.length>1)list=same}
  const seen=new Set();list=list.filter(d=>!seen.has(d.cover)&&seen.add(d.cover));
  if(!list.length){box.innerHTML=`<p class="msg">${esc(msg())}</p>`;return}
  const cur=$('#f-cover').value;
  box.innerHTML=list.map(d=>`<button type="button" data-c="${esc(d.cover)}" aria-pressed="${d.cover===cur}" title="${esc(d.info)}"><img src="${esc(d.cover)}" alt="Couverture, ${esc(d.info)}" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></button>`).join('');
}
async function findCovers(){
  const t=($('#f-title').value+' '+$('#f-author').value).trim();if(!t)return;
  const box=$('#covers');box.classList.remove('hide');box.innerHTML='<p class="msg">Recherche des couvertures…</p>';
  renderCovers(await editions(t));
}

/* ---------- événements ---------- */
$('#add').onclick=()=>openDlg();
$('#cancel').onclick=()=>$('#dlg').close();
$('#f-status').onchange=syncCur;
$('#sgo').onclick=search;
$('#s').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search()}});
$('#rate').onclick=e=>{const r=e.target.closest('[data-r]');if(!r)return;const n=+r.dataset.r;rating=rating===n?0:n;renderRate()};
$('#results').onclick=e=>{
  const r=e.target.closest('.res');if(!r)return;
  const x=$('#results')._docs[+r.dataset.i];
  $('#f-title').value=x.title;$('#f-author').value=x.author;
  $('#f-pages').value=x.pages;$('#f-cover').value=x.cover;
  $('#f-genre').value=x.genre;prev();
  renderCovers($('#results')._docs,x);
  $('#results').innerHTML='';
};
$('#f-cover').oninput=prev;
function prev(){
  const u=$('#f-cover').value.trim(),p=$('#prev'),isData=u.startsWith('data:');
  p.classList.toggle('hide',!u);if(u)p.src=u;
  $('#f-cover').classList.toggle('hide',isData);
  $('#cnote').classList.toggle('hide',!isData);
}
document.querySelectorAll('.langsel').forEach(sel=>sel.onchange=()=>{
  lang=sel.value;
  document.querySelectorAll('.langsel').forEach(x=>x.value=lang);
  if(!$('#covers').classList.contains('hide'))findCovers();
  else if($('#s').value.trim())search();
});
$('#cfind').onclick=findCovers;
$('#covers').onclick=e=>{
  const b=e.target.closest('[data-c]');if(!b)return;
  $('#f-cover').value=b.dataset.c;prev();
  [...$('#covers').children].forEach(c=>c.setAttribute('aria-pressed',c===b));
};
$('#cup').onclick=()=>$('#cfile').click();
$('#cclear').onclick=()=>{$('#f-cover').value='';prev()};
$('#cfile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{
    const w=Math.min(400,im.width),h=Math.round(im.height*w/im.width),c=document.createElement('canvas');
    c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    $('#f-cover').value=c.toDataURL('image/jpeg',.82);prev();URL.revokeObjectURL(u);
    [...$('#covers').children].forEach(x=>x.setAttribute('aria-pressed','false'));
  };
  im.src=u;e.target.value='';
};
$('#form').onsubmit=e=>e.preventDefault();
$('#save').onclick=()=>{
  if(!$('#f-title').value.trim()){$('#f-title').focus();$('#f-title').placeholder='Le titre est obligatoire';return}
  const data={title:$('#f-title').value.trim(),author:$('#f-author').value.trim(),genre:$('#f-genre').value,
    pages:+$('#f-pages').value||0,cover:$('#f-cover').value.trim(),status:$('#f-status').value,
    current:+$('#f-current').value||0,rating,fav:$('#f-fav').value==='1',comment:$('#f-comment').value.trim()};
  if(data.status==='read'&&data.pages)data.current=data.pages;
  if(data.status==='read'&&!(editing&&editing.finished))data.finished=Date.now();
  let id;
  if(editing){Object.assign(editing,data);id=editing.id}else{id=Date.now().toString(36);books.push({id,added:Date.now(),...data})}
  save();render();$('#dlg').close();
  if(editing)openView(id);
};
$('#del').onclick=()=>{
  if(editing&&confirm('Supprimer « '+editing.title+' » ?')){books=books.filter(b=>b!==editing);viewing=null;save();render();$('#dlg').close()}
};
$('#grid').onclick=e=>{const c=e.target.closest('[data-id]');if(c)openView(c.dataset.id)};
$('#tabs').onclick=$('#nav').onclick=e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;render();scrollTo({top:0,behavior:'smooth'})}};
$('#vclose').onclick=()=>$('#view').close();
$('#vedit').onclick=()=>{const id=viewing.id;$('#view').close();openDlg(id)};
$('#vbody').onclick=e=>{
  const t=e.target,b=viewing;if(!b)return;
  const r=t.closest('[data-r]');if(r){const n=+r.dataset.r;updView({rating:b.rating===n?0:n});return}
  if(t.closest('#vfav'))updView({fav:!b.fav});
  else if(t.closest('#vstart'))updView({status:'reading',current:b.current||0,started:Date.now()});
  else if(t.closest('#vdone'))updView({status:'read',current:b.pages||b.current,finished:Date.now()});
  else if(t.closest('#vupd')){
    let n=Math.max(0,+$('#vpage').value||0);if(b.pages)n=Math.min(n,b.pages);
    updView(b.pages&&n>=b.pages?{current:n,status:'read',finished:Date.now()}:{current:n});
  }
};
$('#vbody').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='vpage'){e.preventDefault();$('#vupd').click()}});
$('#q').oninput=e=>{q=e.target.value.toLowerCase();render()};
$('#gf').onchange=e=>{gfilter=e.target.value;render()};
$('#sort').onchange=e=>{sort=e.target.value;render()};
$('#export').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(books,null,2)],{type:'application/json'}));
  a.download='ma-bibliotheque.json';a.click();
};
$('#import').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(Array.isArray(d)&&confirm('Remplacer ta bibliothèque actuelle par ce fichier ?')){books=d;save();render()}
  }catch(err){alert('Fichier illisible.')}
  e.target.value='';
};

/* ---------- init ---------- */
$('#f-genre').innerHTML=GENRES.map(g=>`<option>${g}</option>`).join('');
$('#gf').innerHTML='<option value="">Tous les genres</option>'+GENRES.map(g=>`<option>${g}</option>`).join('');
render();
/* Mise à jour automatique : dès qu'une nouvelle version est publiée, l'appli se recharge toute seule */
if('serviceWorker' in navigator){
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded){reloaded=true;location.reload()}});
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>{
    const check=()=>r.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
  }).catch(()=>{}));
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
